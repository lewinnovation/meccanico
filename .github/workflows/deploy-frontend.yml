name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BUCKET_NAME: meccanico-frontend-dev # Matches the bucket name pattern in Terraform
  API_URL: https://api.meccanico.com # Should be configured as a secret or env var if it varies

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: frontend/dist
          destination: ${{ env.BUCKET_NAME }}
          parent: false

      # Optional: Invalidate Cloud CDN cache if enabled
      # - name: Invalidate Cloud CDN
      #   run: gcloud compute url-maps invalidate-cdn-cache meccanico-url-map-dev --path "/*" --project ${{ env.PROJECT_ID }}

