name: Deploy Frontend (Prod)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_PROD }}
  BUCKET_NAME: meccanico-frontend-prod # Matches the bucket name pattern in Terraform
  API_URL: https://api.meccanico.com # Should be configured as a secret or env var if it varies

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_GHA_SA_EMAIL_PROD }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: frontend/dist
          destination: ${{ env.BUCKET_NAME }}
          parent: false
