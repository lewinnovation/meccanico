steps:
  # Build Backend Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "australia-southeast1-docker.pkg.dev/$PROJECT_ID/meccanico/backend:$COMMIT_SHA",
        "./backend",
      ]

  # Build Frontend Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "australia-southeast1-docker.pkg.dev/$PROJECT_ID/meccanico/frontend:$COMMIT_SHA",
        "./frontend",
      ]

images:
  - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/meccanico/backend:$COMMIT_SHA"
  - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/meccanico/frontend:$COMMIT_SHA"
